<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>

  <canvas id="canvas"></canvas>

  <div id="openCard" class="open-card">
    <div class="open-envelope">
      <h2>💌 A Special Birthday Message</h2>
      <p>Click to Open</p>
    </div>
  </div>

  <section class="hero hidden" id="birthdayContent">
    <div class="card">
      <h1>🎉 Happy Birthday 🎂</h1>
      <h2><span class="name">Anurawr</span></h2>
      <p>
        May your day bloom with joy, sparkle with love, and shine as beautifully
        as these glowing purple lilies.
      </p>
    </div>
  </section>

  <audio id="bgMusic" loop>
    <source src="birthday-song.mp3" type="audio/mpeg" />
  </audio>

  <script src="main.js"></script>
</body>
</html>
