<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="hero">
    <canvas id="canvas"></canvas>

    <div class="card">
      <h1>🎉 Happy Birthday 🎂</h1>
      <h2>To <span class="name">Your Special Person</span></h2>
      <p>
        May your day bloom with joy, sparkle with love, and shine as beautifully
        as these glowing purple lilies.
      </p>
      <a class="button" href="#">Make a Wish ✨</a>
    </div>
  </section>

  <!-- Replace birthday-song.mp3 with your audio file -->
  <audio id="bgMusic" autoplay loop muted>
    <source src="birthday-song.mp3" type="audio/mpeg" />
  </audio>

  <script src="script.js"></script>
</body>
</html>
